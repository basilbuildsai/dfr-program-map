<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFR Adoption Map</title>
<meta name="description" content="A map of U.S. drone-as-first-responder programs. Offline for now.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#F7F8FA;--card:#FFFFFF;--ink:#111827;--ink-2:#4B5563;--line:#E5E7EB;--accent:#1D4ED8}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#111A2E;--ink:#F3F4F6;--ink-2:#9CA3AF;--line:#1F2A44;--accent:#93C5FD}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px 28px}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
h1{font-size:26px;line-height:1.2;margin:0 0 12px}
p{margin:0 0 14px;color:var(--ink-2)}
footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <span class="tag">Work in progress</span>
  <h1>DFR Adoption Map</h1>
  <p>This map of U.S. drone-as-first-responder programs is offline for now.</p>
  <p>It will return at a future date.</p>
  <footer>© 2026 Basil Yap</footer>
</main>
</body>
</html>
